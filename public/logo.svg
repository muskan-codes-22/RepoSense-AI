<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#101B4A"/>
  <!-- Owl face -->
  <circle cx="256" cy="280" r="140" fill="#F5E6C8"/>
  <!-- Left ear -->
  <polygon points="150,180 180,100 220,175" fill="#F5E6C8"/>
  <!-- Right ear -->
  <polygon points="362,175 392,100 422,180" fill="#F5E6C8"/>
  <!-- Left eye -->
  <circle cx="210" cy="260" r="35" fill="#101B4A"/>
  <circle cx="210" cy="260" r="12" fill="#F5E6C8"/>
  <!-- Right eye with magnifying glass -->
  <circle cx="310" cy="260" r="35" fill="#101B4A"/>
  <circle cx="310" cy="260" r="12" fill="#F5E6C8"/>
  <!-- Magnifying glass ring -->
  <circle cx="310" cy="260" r="52" stroke="#101B4A" stroke-width="10" fill="none"/>
  <!-- Magnifying glass handle -->
  <line x1="350" y1="300" x2="390" y2="345" stroke="#101B4A" stroke-width="12" stroke-linecap="round"/>
  <!-- Beak -->
  <polygon points="256,310 240,340 272,340" fill="#101B4A"/>
</svg>
